<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>LAN Agent</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="header"><div class="header-left"><button id="sidebarToggle" class="icon-button mobile-only" aria-label="打开会话列表" aria-expanded="false">☰</button><button id="desktopSidebarToggle" class="icon-button desktop-only" title="切换侧栏" aria-label="切换侧栏">◫</button><a class="brand" href="/">π <span>LAN Agent</span></a></div><div class="header-actions"><span id="connection" role="status">未连接</span><button id="theme" class="icon-button" aria-label="切换深浅主题" title="切换深浅主题">☾</button><button id="pair" class="quiet" disabled>连接手机</button><button id="notify" class="quiet" hidden>通知</button><a id="apkDownload" href="/app.apk" hidden>APK</a><button id="logout" class="quiet" hidden>退出</button></div></header>
<section id="login" class="login"><div class="login-card"><div class="login-symbol">π</div><h1>登录工作区</h1><p>在电脑和手机，接续同一段对话。</p><form id="loginForm"><label for="token">管理员设置的配对码</label><input id="token" type="password" autocomplete="current-password" required minlength="12" maxlength="256" placeholder="输入自定义配对码"><label class="checkbox"><input id="rememberToken" type="checkbox">在自己的设备上记住登录</label><button id="loginButton" class="primary" type="submit">登录</button><p id="loginError" class="form-error" role="alert" hidden></p></form><p class="help">配对码由管理员在 Linux 端设置，不能在此注册。<br>它拥有 agent 操作权限，请不要分享。</p><code id="currentAddress"></code></div></section>
<div id="sidebarBackdrop" class="backdrop" hidden></div>
<main id="workspace" class="workspace" hidden>
<aside id="sidebar" class="sidebar"><div class="sidebar-top"><div class="sidebar-heading"><strong>会话</strong><button id="newSession" title="新建会话（Ctrl/Cmd+N）">＋ 新建</button></div><label class="sr-only" for="projectFilter">项目</label><select id="projectFilter" aria-label="筛选项目"><option value="">所有项目</option></select><input id="sessionSearch" type="search" placeholder="搜索会话…" aria-label="搜索会话"></div><div id="sessions" class="sessions"></div><div class="sidebar-bottom"><span id="sessionCount"></span><p id="root" class="root-path"></p><span id="version"></span><a href="https://github.com/agegr/pi-web" target="_blank" rel="noopener noreferrer">交互参考 pi-web ↗</a></div></aside>
<section class="conversation"><div class="toolbar"><div class="session-heading"><span id="sessionAgent" class="badge">LINUX</span><h2 id="title">新会话</h2><p id="workingDirectory" class="cwd"></p></div><div class="toolbar-right"><button id="exportSession" class="quiet" disabled>导出</button><details id="sessionMenu" class="session-menu"><summary aria-label="会话操作" title="会话操作">⋯</summary><div class="menu-panel"><button id="renameSession" disabled>重命名</button><button id="restartSession" disabled>重启进程 · 继续会话</button><button id="closeSession" disabled>关闭进程 · 保留历史</button><button id="deleteSession" class="danger" disabled>删除会话</button></div></details></div></div>
<div id="sessionWarning" class="warning" hidden><span id="sessionWarningText"></span> <button id="restartInline" type="button">重启进程</button></div><div id="plan" class="plan" hidden></div><div id="choices" class="choices" aria-live="polite"></div>
<div class="timeline-wrap"><div id="timeline" class="timeline" aria-live="polite"><div id="emptyState" class="empty-state"><div class="empty-symbol">π</div><h3>有什么可以帮你？</h3><p>选择 Pi 或 Codex，开始一个新会话。<br>消息、思考和工具进度会在这里实时显示。</p><button id="emptyNew">＋ 新建会话</button></div></div><button id="scrollLatest" class="scroll-latest" aria-label="回到最新消息" hidden>↓ 最新</button></div>
<div class="composer-area"><form id="promptForm" class="composer"><label for="prompt" class="sr-only">对话输入</label><textarea id="prompt" rows="1" placeholder="输入消息…" disabled></textarea><div class="send-actions"><button id="stop" class="danger" type="button" disabled>■ 停止</button><button id="send" type="submit" disabled>↑ 发送</button></div></form><div class="composer-controls"><label for="model" class="sr-only">当前模型</label><div class="model-controls"><input id="modelSearch" type="search" placeholder="搜索模型" aria-label="搜索模型" disabled><select id="model" aria-label="选择模型" disabled><option>新建会话后加载模型</option></select></div><span id="status" role="status">同一网页，接续会话</span><span id="agentActivity" role="status" hidden></span><span id="pending" role="status"></span></div><div class="composer-hint"><span id="composerHint">Enter 发送 · Shift+Enter 换行 · 手机 Enter 换行</span><button id="enterMode" class="quiet" title="切换桌面发送快捷键">Enter ↵</button></div></div>
</section></main>
<dialog id="createDialog"><div class="dialog-heading"><h2>新建会话</h2><button id="closeCreate" class="icon-button" aria-label="关闭新建会话">×</button></div><form id="createForm"><label for="agent">Agent</label><select id="agent"><option value="pi">Pi</option><option value="codex">Codex</option></select><p id="agentHint" class="help"></p><label for="sessionName">名称（可选）</label><input id="sessionName" maxlength="120" placeholder="给这段对话起个名字"><label for="cwd">Linux 项目目录</label><input id="cwd" value="." required><p id="cwdHint" class="help"></p><p id="createError" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button id="cancelCreate" type="button">取消</button><button id="createButton" class="primary" type="submit">创建会话</button></div></form></dialog>
<dialog id="deleteDialog"><h2>删除会话？</h2><p id="deleteTitle"></p><p class="help">停止 agent 并删除本服务的历史。所有设备同步移除，不能撤销。</p><p id="deleteError" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button id="cancelDelete">取消</button><button id="confirmDelete" class="danger-solid">确认删除</button></div></dialog>
<dialog id="renameDialog"><h2>重命名会话</h2><form id="renameForm"><label for="renameTitle">名称</label><input id="renameTitle" maxlength="120" required><p id="renameError" class="form-error" hidden></p><div class="dialog-actions"><button id="cancelRename" type="button">取消</button><button type="submit" class="primary">保存名称</button></div></form></dialog>
<dialog id="pairDialog"><div class="dialog-heading"><h2>连接手机</h2><button id="closePair" class="icon-button" aria-label="关闭手机连接">×</button></div><div class="tabs"><button id="pairWebTab" class="active" aria-pressed="true">手机网页</button><button id="pairAppTab" aria-pressed="false">Android APP</button></div><label class="checkbox"><input id="pairCredentials" type="checkbox">网页二维码包含配对码（扫码免输，请勿分享）</label><p id="pairHelp" class="help"></p><img id="qr" alt="手机连接二维码"><label for="pairUrl">连接地址</label><input id="pairUrl" readonly><button id="copyPair">复制连接信息</button></dialog>
<div id="toast" class="toast" role="alert" hidden></div><script src="/app.js" type="module"></script></body></html>
