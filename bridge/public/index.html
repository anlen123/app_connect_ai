<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Agent · 控制室</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">L<span>↗</span>A <small>LAN AGENT / 控制室</small></div><a href="/app.apk">安卓 APK ↓</a><div id="connection" role="status">未连接</div><button id="pair">手机配对</button></header>
<section id="login"><p class="eyebrow">PRIVATE NETWORK. SHARED CONTEXT.</p><h1>工作在电脑。<br>掌控在手边。</h1><p>实时跟进 WSL 中的 pi / Codex。对话、思考、工具和每一次待决策。</p><form id="loginForm"><label>终端显示的配对码<input id="token" type="password" autocomplete="off" required placeholder="输入配对码，不是 AI API key"></label><button>进入控制室 ↗</button></form></section>
<main id="workspace" hidden><aside><p class="eyebrow">SESSIONS / 会话</p><div id="sessions"></div><form id="createForm"><label>Agent<select id="agent"><option>pi</option><option>codex</option></select></label><label>项目目录（桥接根目录内）<input id="cwd" value="." required></label><button>＋ 新建会话</button></form></aside><section class="conversation"><div class="toolbar"><div><p class="eyebrow">LIVE WORKSPACE</p><h2 id="title">选择或新建会话</h2><p id="status">等待连接</p></div><div><select id="model" aria-label="模型"></select><button id="stop">停止任务</button><button id="closeSession">关闭会话</button></div></div><div id="plan"></div><div id="choices"></div><div id="timeline" aria-live="polite"></div><form id="promptForm"><textarea id="prompt" placeholder="输入任务，Shift + Enter 换行" aria-label="任务输入" required></textarea><button id="send">发送 ↗</button></form></section></main>
<dialog id="pairDialog"><button id="closePair">关闭</button><h2>把控制室带走</h2><p>安卓 APP 扫描此码。二维码包含配对凭据，请勿分享。</p><img id="qr" alt="连接二维码"><code id="pairUrl"></code></dialog><div id="toast" role="alert"></div><script src="/app.js" type="module"></script></body></html>
